[General]
# Small dim label inside the top-left corner mark. install.sh fills it with the
# host name; set it to anything, or hide it with showCaption=false.
caption=host
showCaption=true

# The clock uses the shared Breeze Clock component, so it matches the lock
# screen's clock exactly.
showClock=true

# Face Unlock button. It hands PAM an empty secret so pam_howdy gets its turn.
# Never fires on its own — see README.md, "Face unlock and pam_faillock".
showFaceUnlock=true
